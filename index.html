<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Sprite Slicer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="drag-region"></div>
      <div class="header-content">
        <div class="header-left">
          <h1 class="app-title">Sprite Slicer</h1>
          <p class="app-subtitle">Split sprite sheets into individual frames</p>
        </div>
        <div class="header-right">
          <div class="mode-tabs">
            <button id="modeSlice" class="mode-tab active">Slice</button>
            <button id="modeTilemap" class="mode-tab">Tilemap</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Left Panel: Settings -->
      <section class="panel settings-panel">
        <h2 class="panel-title">Settings</h2>

        <!-- Image Selection -->
        <div class="setting-group">
          <label class="setting-label">Source Images</label>
          <div id="dropZone" class="drop-zone">
            <div class="drop-zone-content">
              <div class="drop-zone-icon">+</div>
              <p class="drop-zone-text">Drag & drop images here</p>
              <p class="drop-zone-subtext">or</p>
              <button id="selectImagesBtn" class="btn btn-primary">
                Select Images
              </button>
            </div>
          </div>
          <div id="imageList" class="image-list"></div>
        </div>

        <!-- Grid Settings -->
        <div class="setting-group">
          <label class="setting-label">Grid Configuration</label>
          <div class="grid-inputs">
            <div class="input-group">
              <label for="columns">Columns</label>
              <input type="number" id="columns" value="4" min="1" max="100">
            </div>
            <div class="input-group">
              <label for="rows">Rows</label>
              <input type="number" id="rows" value="4" min="1" max="100">
            </div>
          </div>
          <div class="frame-info" id="frameInfo">
            Total frames: <span id="totalFrames">16</span>
          </div>
        </div>

        <!-- Output Settings -->
        <div class="setting-group">
          <label class="setting-label">Output Settings</label>

          <!-- Numbering Mode -->
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="numberingMode" id="perFileNumbering" value="perFile" checked>
              <span class="radio-text">Per-file (a_000, a_001, b_000, b_001...)</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="numberingMode" id="sequentialNumbering" value="sequential">
              <span class="radio-text">Sequential (sprite_000, sprite_001, sprite_002...)</span>
            </label>
          </div>

          <div class="input-group" id="baseNameGroup">
            <label for="baseName">Base Name <span id="baseNameOptional">(optional)</span></label>
            <input type="text" id="baseName" placeholder="sprite">
          </div>
          <button id="selectOutputBtn" class="btn btn-secondary btn-block">
            <span class="btn-icon">📁</span>
            Select Output Folder
          </button>
          <div id="outputPath" class="output-path">No folder selected</div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
          <button id="previewBtn" class="btn btn-secondary" disabled>
            Preview Grid
          </button>
          <button id="sliceBtn" class="btn btn-primary" disabled>
            Slice Sprites
          </button>
        </div>
        <div class="action-buttons" style="margin-top: 12px;">
          <button id="sliceToPaletteBtn" class="btn btn-accent btn-block" disabled>
            Slice to Palette
          </button>
        </div>
      </section>

      <!-- Right Panel: Preview / Tilemap Canvas -->
      <section class="panel preview-panel">
        <!-- Slice Mode Content -->
        <div id="sliceModeContent">
          <div class="panel-header">
            <h2 class="panel-title">Preview</h2>
            <div id="zoomControls" class="zoom-controls hidden">
              <button id="zoomOutBtn" class="zoom-btn" title="Zoom Out">-</button>
              <span id="zoomLevel" class="zoom-level">100%</span>
              <button id="zoomInBtn" class="zoom-btn" title="Zoom In">+</button>
              <button id="zoomResetBtn" class="zoom-btn zoom-reset" title="Reset Zoom">Reset</button>
            </div>
          </div>
          <div id="previewContainer" class="preview-container">
            <div class="preview-placeholder">
              <div class="placeholder-icon">🖼️</div>
              <p>Select an image to preview</p>
            </div>
          </div>
          <div id="previewInfo" class="preview-info"></div>
        </div>

        <!-- Tilemap Mode Content -->
        <div id="tilemapModeContent" class="hidden">
          <div class="tilemap-toolbar">
            <div class="canvas-size-controls">
              <label>Canvas:</label>
              <input type="number" id="canvasColumns" value="16" min="1" max="64">
              <span>x</span>
              <input type="number" id="canvasRows" value="16" min="1" max="64">
              <span>tiles</span>
              <button id="resizeCanvasBtn" class="btn btn-secondary btn-sm">Apply</button>
            </div>
            <div class="tilemap-zoom-controls">
              <button id="tilemapPanBtn" class="zoom-btn pan-btn" title="Pan Tool (Hold to drag canvas)">✋</button>
              <button id="tilemapZoomOutBtn" class="zoom-btn" title="Zoom Out">-</button>
              <span id="tilemapZoomLevel" class="zoom-level">100%</span>
              <button id="tilemapZoomInBtn" class="zoom-btn" title="Zoom In">+</button>
              <button id="tilemapZoomResetBtn" class="zoom-btn zoom-reset" title="Reset Zoom">Reset</button>
            </div>
            <div class="tilemap-actions">
              <button id="loadBgBtn" class="btn btn-secondary btn-sm">Load BG</button>
              <button id="clearBgBtn" class="btn btn-secondary btn-sm hidden">Clear BG</button>
              <button id="clearCanvasBtn" class="btn btn-secondary btn-sm">Clear</button>
              <button id="exportTilemapBtn" class="btn btn-primary btn-sm">Export PNG</button>
            </div>
          </div>
          <div id="tilemapCanvasContainer" class="tilemap-canvas-container">
            <div id="tilemapCanvasWrapper" class="tilemap-canvas-wrapper">
              <canvas id="tilemapCanvas"></canvas>
            </div>
          </div>
          <div id="tilemapInfo" class="preview-info"></div>
        </div>
      </section>

      <!-- Tile Palette Panel (Tilemap mode only) -->
      <section class="panel palette-panel hidden" id="palettePanel">
        <div class="panel-header">
          <h2 class="panel-title">Tile Palette</h2>
          <button id="paletteViewToggle" class="view-toggle-btn" title="Toggle View">
            <span class="view-icon grid-icon">▦</span>
            <span class="view-icon list-icon hidden">▤</span>
          </button>
        </div>
        <div class="palette-toolbar">
          <button id="loadTilesBtn" class="btn btn-secondary btn-sm btn-block">Load Tiles from Folder</button>
        </div>
        <div class="palette-info">
          <span id="paletteCount">0</span> tiles loaded
          <span id="tileSizeInfo"></span>
        </div>
        <div id="tilePalette" class="tile-palette"></div>
        <div class="eraser-tool">
          <button id="eraserBtn" class="btn btn-secondary btn-block">
            Eraser Tool
          </button>
        </div>
      </section>
    </main>

    <!-- Progress Modal -->
    <div id="progressModal" class="modal hidden">
      <div class="modal-content">
        <h3>Processing...</h3>
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText">0 / 0 frames</p>
      </div>
    </div>

    <!-- Result Modal -->
    <div id="resultModal" class="modal hidden">
      <div class="modal-content result-modal-content">
        <h3 id="resultTitle">Complete!</h3>
        <div id="resultSummary" class="result-summary"></div>
        <div class="modal-actions">
          <button id="openFolderBtn" class="btn btn-secondary">Open Folder</button>
          <button id="closeResultBtn" class="btn btn-primary">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
